<script>
// ---------- helpers ----------
const L=(a,b,c,d,s='o')=>['l',a,b,c,d,s];
const T=(s,x,y,n='middle',r=0)=>['t',s,x,y,n,r];
const D=(x,y)=>['p',x,y];
const arcAt=(cx,cy,r,px,py)=>{const t=Math.atan2(py-cy,px-cx),s=.2,f=a=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];const p=f(t-s),q=f(t+s);return['a',`M${p[0]},${p[1]}A${r},${r} 0 0 1 ${q[0]},${q[1]}`,'c']};
const rd=n=>Math.round(n*100)/100;

// ---------- Q1(i): Square pyramid on a slant edge ----------
const h=30/Math.SQRT2, w=2*h, E=Math.hypot(60,h), X=80, Ty=115.2, cx=45, A=cx-h, C=cx+h, c2=100;
const a2=[c2+14.142,40], b2=[c2+7.071,60], o2=[c2+E,X], dT=Ty-h, bT=Ty+h;
const Q1=[
{t:'Draw the reference line XY',ops:[L(5,X,185,X,'xy'),T('X',1.5,X+1.6),T('Y',187,X+1.6)],
 what:'A long horizontal line XY with the letters X (left) and Y (right).',
 why:'XY is the meeting line of the two planes: everything above it is the front view (on VP), everything below is the top view (on HP). The pyramid lies on the ground, so its lowest points will sit exactly on XY.',
 how:'Draw a 180 mm horizontal line near the middle of the sheet with a set-square on a T-square. Write X at the left end and Y at the right end.',
 name:'X and Y are just the ends of the reference line (ground line).',rule:'Front view (elevation) is above XY and top view (plan) is below XY. Heights are measured up from XY; distances from the VP are measured down from XY.'},
{t:'Top view: diagonal ac',ops:[L(A,Ty,C,Ty,'o'),T('a',A-4,Ty+1.5),T('c',C+4,Ty+1.5)],
 what:'A horizontal line a–c, 42.43 mm long, parallel to XY, about 14 mm below it.',
 why:'Initially the pyramid stands on its square base on HP, so its top view is the true square. The axis must be parallel to VP and the final resting edge a slant edge, so we start with diagonal ac parallel to XY.',
 how:'Diagonal of the square = 30 × √2 = 42.43 mm. Mark a at the left, measure 42.43 mm to the right and mark c. Keep the line light.',
 name:'Small letters (a, b, c, d, o, p) are used for the TOP view. a, b, c, d are the base corners, o is the apex.',rule:'Capital letters = real object; small letters = top view; small letters with ′ = front view.'},
{t:'Top view: diagonal bd and centre o(p)',ops:[L(cx,dT,cx,bT,'o'),D(cx,Ty),T('d',cx+3,dT-1),T('b',cx+3,bT+4.5),T('o(p)',cx+2,Ty+5.5,'start')],
 what:'A vertical line b–d, 42.43 mm long, crossing ac at its midpoint.',
 why:'The diagonals of a square bisect each other at right angles; their crossing is the centre of the base.',
 how:'Find the midpoint of ac (21.21 mm from each end). Draw a perpendicular through it with a set-square, 21.21 mm up (d) and 21.21 mm down (b).',
 name:'o is the apex of the pyramid. Because the pyramid is upright, the apex is directly above the base centre p, so o and p coincide in the top view and are written o(p). p is the axis foot (centre of the base).',rule:'Apex of an upright pyramid projects at the centre of its base in the top view.'},
{t:'Top view: join the sides',ops:[['l',A,Ty,cx,dT,'o'],['l',cx,dT,C,Ty,'o'],['l',C,Ty,cx,bT,'o'],['l',cx,bT,A,Ty,'o']],
 what:'The square abcd: lines ab, bc, cd, da.',
 why:'This completes the true shape of the 30 mm square base.',
 how:'Join a–d, d–c, c–b, b–a. Each should measure 30 mm – check one with the scale.',
 name:'The letters run a→b→c→d round the square, so neighbouring letters are neighbouring corners.',rule:'Visible edges are drawn as thick continuous lines.'},
{t:'Dimension: 30',ops:[L(18.13,120.86,39.34,142.06,'d'),T('30',24,135.5,'middle',45)],
 what:'A thin dimension line parallel to side ab, marked 30.',
 why:'It records the given base side so the drawing can be checked.',
 how:'Draw a thin line parallel to ab, a few mm outside it, with small arrowheads at both ends, and write 30 above it.',name:'No point labels here.',rule:'Dimension lines are thin; the number is written above the line.'},
{t:'Project a, o(p), c upward',ops:[L(A,Ty,A,14,'c'),L(cx,Ty,cx,14,'c'),L(C,Ty,C,14,'c')],
 what:'Three thin vertical projector lines from a, o(p) and c, up across XY.',
 why:'A point and its front view lie on the same vertical line. This fixes where the front view stands.',
 how:'Place the set-square on the T-square and draw light vertical lines from a, the centre point and c to about 70 mm above XY.',
 name:'Projector lines carry no letters.',rule:'Projectors are thin, light and perpendicular to XY.'},
{t:'Mark a′, b′(d′), c′ on XY',ops:[D(A,X),D(cx,X),D(C,X),T('a′',A-1,X+6),T('b′(d′)',cx,X+6),T('c′',C+1,X+6),T('p′',cx+4,X-2.5)],
 what:'Three points on XY where the projectors cut it.',
 why:'The base is on the ground, so its front view lies on XY. b and d are at different distances from VP but the same distance from the left/right, so b′ and d′ fall on the same point.',
 how:'Mark the intersections of the three projectors with XY. Write a′ at left, c′ at right and b′(d′) in the middle.',
 name:'a′, b′, c′, d′ are the front views of a, b, c, d. b′(d′) means two points coincide (b is in front of d, so b′ hides d′). p′ is the front view of p, the base centre – on this view it sits at the same point.',rule:'Brackets show the hidden point behind a visible one in the same view.'},
{t:'Mark apex o′ at 60 mm',ops:[D(cx,X-60),T('o′',cx,X-63)],
 what:'The point o′ on the centre projector, 60 mm above XY.',
 why:'The altitude is 60 mm; the apex is directly above p so it lies on the centre projector.',
 how:'Measure 60 mm up from p′ along the centre projector and mark o′.',name:'o′ is the front view of apex o.',rule:'Height of any point = its distance above XY in the front view.'},
{t:'Join a′o′ and o′c′; close the base',ops:[L(A,X,cx,X-60),L(cx,X-60,C,X),L(A,X,C,X)],
 what:'Triangle a′o′c′ with base a′c′ lying on XY.',
 why:'These are the outlines of the pyramid in front view: the two slant edges oa and oc and the base.',
 how:'Join a′–o′, o′–c′ and darken a′–c′ along XY.',name:'Slant edges oa and oc appear as a′o′ and o′c′ (true length is not shown here because they are inclined to VP).',rule:'The initial front view of an upright pyramid is an isosceles triangle on XY.'},
{t:'Join o′ to b′(d′)',ops:[L(cx,X-60,cx,X,'o')],
 what:'A vertical line o′–b′(d′) (the axis o′p′ coincides with it).',
 why:'Edges ob and od lie in a plane parallel to VP’s side, so both appear as the single line o′b′(d′).',
 how:'Join o′ to the middle point.',name:'o′b′(d′) = edges ob and od hiding each other.',rule:'Coincident edges are drawn once.'},
{t:'Dimension: 60',ops:[L(15,20,15,80,'d'),L(15,20,45,20,'d'),T('60',12,50,'middle',-90)],
 what:'The altitude dimension 60.',why:'Records the given height.',
 how:'Draw an extension line from o′ to the left, a vertical dimension line with arrows between it and XY, and write 60.',name:'—',rule:'Extension lines project out from the feature, dimension line between them.'},
{t:'New front view: fix c′ on XY',ops:[D(c2,X),T('c′',c2-2,X+6)],
 what:'A fresh point c′ on XY at x = 100 (to the right of the first view).',
 why:'Now the pyramid is tilted until slant edge oc lies on the ground. Edge o′c′ becomes a horizontal line on XY, so we redraw the front view with o′c′ on XY. The true length of o′c′ is kept (it did not change when tilting).',
 how:'Choose a point on XY far enough from the first view and mark it c′.',name:'Same letters are reused for the new view of the same corners.',rule:'When a solid is tilted about an axis perpendicular to VP, the front view keeps its shape and size and only rotates.'},
{t:'Draw c′o′ along XY (63.64 mm)',ops:[L(c2,X,o2[0],X,'o'),D(o2[0],X),T('o′',o2[0]+3,X+6)],
 what:'The edge c′o′ on XY, 63.64 mm long, with o′ at its right end.',
 why:'Slant edge length = √(60² + 21.21²) = 63.64 mm. This is the length of o′c′ in the first front view and is kept.',
 how:'Measure o′c′ on the first view with the compass (63.64 mm). Place the point on c′ and cut XY to the right to get o′.',
 name:'o′ is the apex in the new front view.',rule:'The resting edge of the pyramid lies on XY in the front view.'},
{t:'Arc from c′ (radius c′a′ = 42.43)',ops:[arcAt(c2,X,w,a2[0],a2[1])],
 what:'A small arc about c′ with radius 42.43 mm, above XY.',
 why:'a′ is 42.43 mm from c′ (the base diagonal a′c′ of the first view).',
 how:'Set compass to a′c′ of the first view, put the point at the new c′ and draw an arc above XY.',name:'—',rule:'A point is located from two known distances – the intersection of two arcs.'},
{t:'Arc from o′ (radius o′a′ = 63.64); mark a′',ops:[arcAt(o2[0],X,E,a2[0],a2[1]),D(a2[0],a2[1]),T('a′',a2[0]+1,a2[1]-3)],
 what:'A second arc about o′ with radius 63.64 mm; their meeting point is a′.',
 why:'a′ is also 63.64 mm from o′ (all slant edges are equal: oa = oc).',
 how:'Keep the compass at o′a′ length (same 63.64 mm), place on new o′ and cut the first arc. Label the crossing a′.',name:'a′ is the front view of base corner a, now raised above the ground.',rule:'Intersecting arcs fix the third vertex of a triangle of known sides.'},
{t:'Join c′a′ and a′o′',ops:[L(c2,X,a2[0],a2[1]),L(a2[0],a2[1],o2[0],X)],
 what:'The triangle a′c′o′.',why:'a′c′ is the base diagonal edge-on; a′o′ is slant edge oa.',
 how:'Join c′–a′ and a′–o′ with thick lines.',name:'—',rule:'Outline of a tilted solid = tilted copy of the original outline.'},
{t:'Mark b′(d′) at the middle of c′a′ and join to o′',ops:[D(b2[0],b2[1]),T('b′(d′)',b2[0]-4,b2[1]-2.5,'end'),T('p′',b2[0]+2,b2[1]+6.5,'start'),L(b2[0],b2[1],o2[0],X)],
 what:'The point b′(d′) at the midpoint of c′a′, joined to o′.',
 why:'In the first view b′(d′) was the midpoint of a′c′; the same proportion holds after tilting. The line b′o′ shows edges ob and od together; p′ (base centre) lies at the same point.',
 how:'Bisect c′a′ and mark the midpoint; join it to o′.',name:'b′(d′): both b and d project here. p′: base centre, coincident with b′(d′) in this view (the faculty sheet writes p′ just beside it).',rule:'Division ratios on a line are unchanged by rotation.'},
{t:'Project all points downward',ops:[L(c2,X,c2,140,'c'),L(a2[0],a2[1],a2[0],140,'c'),L(b2[0],b2[1],b2[0],140,'c'),L(o2[0],X,o2[0],140,'c')],
 what:'Four vertical projectors from c′, a′, b′(d′), o′ downward.',
 why:'Each point of the new top view lies directly below its new front view.',
 how:'Draw light vertical lines down from each point, about 60 mm below XY.',name:'—',rule:'Front and top views of a point are on one vertical line.'},
{t:'Carry distances across from the first top view',ops:[L(A,dT,185,dT,'c'),L(A,Ty,185,Ty,'c'),L(A,bT,185,bT,'c')],
 what:'Three horizontal lines through d, the centre line a–c, and b.',
 why:'Tilting about a line perpendicular to VP does not change how far each point is from VP, so each point’s distance below XY stays the same.',
 how:'Extend the horizontal lines of d, a/c/o/p and b from the first top view to the right.',name:'—',rule:'Distances from XY in the top view stay constant when tilting only changes height.'},
{t:'Plot c, p, a, o on the centre line',ops:[D(c2,Ty),T('c',c2-3,Ty-2),D(b2[0],Ty),T('p',b2[0],Ty+5.5),D(a2[0],Ty),T('a',a2[0]+3,Ty-2),D(o2[0],Ty),T('o',o2[0]+3,Ty+1.5)],
 what:'Four points on the middle horizontal line.',
 why:'These points are on the axis plane, at the same distance from VP as the first a, c, o, p.',
 how:'Mark the intersections of the middle horizontal with the four projectors from c′, b′(d′)/p′, a′, o′. Label them.',name:'c, p, a, o are the top views of the same-named points. p is below p′.',rule:'Intersection of projector and horizontal gives the top view of a point.'},
{t:'Plot b and d',ops:[D(b2[0],dT),T('d',b2[0]+3,dT-1.5),D(b2[0],bT),T('b',b2[0],bT+5.5)],
 what:'Points d (upper) and b (lower) on the projector of b′(d′).',
 why:'b and d lie on one projector (b′(d′)); they are separated by their distances from VP.',
 how:'Mark where the projector from b′(d′) cuts the top and bottom horizontals.',name:'d is above b in the top view, same as in the first top view.',rule:'Two points on one projector: coincident front views, separate top views.'},
{t:'Join the lateral edges o–d and o–b',ops:[L(o2[0],Ty,b2[0],dT),L(o2[0],Ty,b2[0],bT)],
 what:'Lines from o to d and o to b.',why:'Edges od and ob are visible from above.',
 how:'Join o–d and o–b with thick lines.',name:'—',rule:'Visible edges: thick continuous.'},
{t:'Join a–d and a–b',ops:[L(a2[0],Ty,b2[0],dT),L(a2[0],Ty,b2[0],bT)],
 what:'Lines from a to d and a to b.',why:'These are base edges ad and ab, visible from above.',
 how:'Join a–d, a–b.',name:'—',rule:'Visible edges: thick continuous.'},
{t:'Join c–d and c–b',ops:[L(c2,Ty,b2[0],dT),L(c2,Ty,b2[0],bT)],
 what:'Lines from c to d and c to b.',why:'These are base edges cd and cb.',
 how:'Join c–d, c–b.',name:'—',rule:'Visible edges: thick continuous.'},
{t:'Join a–o (visible)',ops:[L(a2[0],Ty,o2[0],Ty)],
 what:'The horizontal line from a to o.',why:'Edge oa is visible; edge oc overlaps it on the same line.',
 how:'Join a to o with a thick line.',name:'—',rule:'Overlapping lines are drawn once, thicker for visible.'},
{t:'Dashed line c–a (hidden base diagonal)',ops:[['l',c2,Ty,a2[0],Ty,'h']],
 what:'A short dashed line from c to a.',why:'The base diagonal ca lies underneath the pyramid, hidden when seen from above.',
 how:'Draw short dashes (2 mm dash, 1 mm gap) from c to a. Check against the faculty sheet (page 2).',name:'—',rule:'Hidden edges are dashed.'}
];

// ---------- Q1(ii): Square pyramid on a base edge ----------
const X2=80, U=25, hh=30/Math.SQRT2, ux=U+hh, uy=X2-60, vx=U+60/Math.SQRT2, vy=X2-60/Math.SQRT2;

 const wmRule=mk('line',{x1:35,y1:77,x2:147,y2:77,class:'wm-rule',transform:'rotate(-24 91 77)'});
 wm.appendChild(wmRule);wm.appendChild(wmText);wm.appendChild(wmSmall);svg.appendChild(wm);
 const S=cur[3]||[];
 activeModule=moduleDefs.findIndex(m=>m.test(i));renderQuestionPicker();
 document.getElementById('mod').textContent=moduleDefs[activeModule].label;
 document.getElementById('q').innerHTML=cur[2]?`<b>${cur[0].split(' – ')[1]}</b>${cur[2]}`:`<b>${cur[0]}</b><span class="pend">${PEND}</span>`;
 S.forEach(s=>{const g=mk('g',{});g.style.display='none';s.ops.forEach(o=>{if(o[0]=='l')g.appendChild(mk('line',{x1:rd(o[1]),y1:rd(o[2]),x2:rd(o[3]),y2:rd(o[4]),class:'l '+o[5],pathLength:1}));
 else if(o[0]=='a')g.appendChild(mk('path',{d:o[1],class:'l '+o[2],pathLength:1}));
 else if(o[0]=='p')g.appendChild(mk('circle',{cx:rd(o[1]),cy:rd(o[2]),r:.9,class:'pt'}));
 else{const t=mk('text',{x:rd(o[2]),y:rd(o[3]),'text-anchor':o[4]});if(o[5])t.setAttribute('transform',`rotate(${o[5]} ${rd(o[2])} ${rd(o[3])})`);t.textContent=o[1];g.appendChild(t)}});svg.appendChild(g);gs.push(g)});
 // Fit every step's geometry into the fixed drawing frame.
 let bx=Infinity,by=Infinity,br=-Infinity,bb=-Infinity;
 gs.forEach(g=>{g.style.display='';const b=g.getBBox();if(b.width||b.height){bx=Math.min(bx,b.x);by=Math.min(by,b.y);br=Math.max(br,b.x+b.width);bb=Math.max(bb,b.y+b.height)}g.style.display='none'});
 if(Number.isFinite(bx)){const pad=Math.max(5,(br-bx)*.045,(bb-by)*.045);svg.setAttribute('viewBox',`${bx-pad} ${by-pad} ${Math.max(1,br-bx+2*pad)} ${Math.max(1,bb-by+2*pad)}`)}
 draw()}
function draw(){const S=cur[3]||[];gs.forEach((g,i)=>{g.style.display=i<n?'':'none';g.classList.remove('new');if(i==n-1){void g.getBoundingClientRect();g.classList.add('new')}});
 const t=document.getElementById('ttl'),e=document.getElementById('exp');
 document.getElementById('pb').style.width=S.length?100*n/S.length+'%':'0';
 document.getElementById('cnt').textContent=S.length?`Step ${n} of ${S.length}`:'';
 document.getElementById('pv').disabled=n==0;document.getElementById('nx').disabled=n>=S.length;
 document.getElementById('sk').disabled=!S.length||n>=S.length;
 if(!S.length){t.textContent='Not yet available';e.innerHTML=`<p>${PEND}</p>`;return}
 if(n==0){t.textContent='Blank sheet';e.innerHTML='<h3>STARTING POINT</h3><p>The drawing area is clear. Press NEXT to add the first construction. Each press adds one operation while keeping all earlier construction visible.</p><h3>HOW TO FOLLOW</h3><p>Read the FROM → TO line before drawing. It tells you what the previous drawing looked like and exactly what this next step adds.</p>';return}
 const s=S[n-1],from=(n===1?'Blank sheet':S[n-2].t);t.textContent=s.t;
 e.innerHTML=`<h3>FROM → TO</h3><p><b>${from}</b> → <b>${s.t}</b>. Start with the drawing from the previous step. In this step, add only the construction described below; do not erase earlier lines.</p><h3>WHAT THIS STEP ADDS</h3><p>${s.what}</p><h3>WHY THIS IS DONE</h3><p>${s.why}</p><h3>HOW TO DRAW IT</h3><p>${s.how}</p><h3>POINTS / LABELS</h3><p>${s.name}</p><h3>RULE / CONCEPT</h3><p>${s.rule}</p>`+(n==S.length?'<h3>FINAL CHECK</h3><p>Compare the completed projections with the supplied reference drawing. Check the point labels, visible and hidden edges, and alignment of all projectors. Exact checking against the original question sheet is still required.</p>':'')}
const go=d=>{const S=cur[3]||[];n=Math.max(0,Math.min(S.length,n+d));draw()};
document.getElementById('nx').onclick=()=>go(1);document.getElementById('pv').onclick=()=>go(-1);
document.getElementById('sk').onclick=()=>{n=(cur[3]||[]).length;draw()};
document.getElementById('rs').onclick=()=>{n=0;draw()};
sel.onchange=()=>{const chosen=Number(sel.value);n=0;load(chosen);};
addEventListener('keydown',e=>{if(e.target==sel)return;if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1);if(e.key=='Home'){n=0;draw()}});
load(0);
</script></body></html>
